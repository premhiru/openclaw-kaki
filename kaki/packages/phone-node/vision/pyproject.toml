[project]
name = "kaki-phone-vision"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pip-audit>=2.10.0", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.12.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
