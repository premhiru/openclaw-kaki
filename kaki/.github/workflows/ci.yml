name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:qa
      - run: pnpm test:e2e
      - run: pnpm evals
      - run: pnpm security:scan
      - run: pnpm audit --audit-level high

  python-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit Python lock files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t locks < <(find . -name requirements.txt -o -name requirements.lock)
          if ((${#locks[@]} == 0)); then
            echo "No Python requirement lock files yet."
          else
            for lock in "${locks[@]}"; do python -m pip_audit -r "$lock"; done
          fi

  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Installer dry run
        run: ./scripts/install.sh --dry-run
