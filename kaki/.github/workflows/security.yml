name: Security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

jobs:
  security-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @kaki/security lint
      - run: pnpm --filter @kaki/security test
      - run: node scripts/qa/replay-fixtures.mjs --tag security
      - run: pnpm security:scan
      - run: pnpm audit --audit-level high
