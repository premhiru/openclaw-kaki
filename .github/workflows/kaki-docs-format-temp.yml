name: Kaki docs format (temporary)

on:
  push:
    branches:
      - codex/kaki-complete-docs

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/kaki-complete-docs
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format documentation and remove temporary workflow
        run: |
          pnpm exec oxfmt README.md docs/docs.json docs/kaki
          rm .github/workflows/kaki-docs-format-temp.yml
      - name: Commit canonical formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/docs.json docs/kaki .github/workflows/kaki-docs-format-temp.yml
          git diff --cached --quiet && exit 0
          git commit -m "docs: format complete Kaki manual"
          git push origin HEAD:codex/kaki-complete-docs