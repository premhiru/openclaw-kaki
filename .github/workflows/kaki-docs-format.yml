name: Kaki docs one-time format

on:
  push:
    branches: [codex/kaki-rebuild]
    paths: [.github/workflows/kaki-docs-format.yml]

permissions:
  contents: write

jobs:
  format:
    if: "github.event.head_commit.message == 'ci: repair one-time docs formatter'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/kaki-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install and format documentation
        shell: bash
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec oxfmt \
            .ci-harness/KAKI.md \
            KAKI.md \
            docs/kaki/index.md \
            docs/kaki/limitations.md \
            docs/kaki/onboarding.md \
            docs/kaki/operations.md \
            docs/kaki/quickstart.md \
            docs/kaki/reference.md \
            docs/kaki/troubleshooting.md \
            docs/kaki/using-kaki.md \
            kaki/README.md \
            kaki/docs/ONBOARDING.md
      - name: Commit formatted documentation and remove formatter
        shell: bash
        run: |
          rm .github/workflows/kaki-docs-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-harness/KAKI.md KAKI.md docs/kaki kaki/README.md kaki/docs/ONBOARDING.md .github/workflows/kaki-docs-format.yml
          git commit -m 'docs(kaki): apply canonical formatting'
          git push origin HEAD:codex/kaki-rebuild